<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Redefinir senha — OpenHUD AI</title>
<meta name="description" content="Defina uma nova senha para a sua conta OpenHUD AI." />
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/static/site/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/static/site/site.css?v=5.1.0" />
</head>
<body>
<header class="site">
  <div class="wrap nav" id="nav">
    <a class="brand" href="/"><img src="/static/site/logo.svg" alt="" width="26" height="26" /> OpenHUD AI</a>
    <button class="btn ghost nav-toggle" id="nav-toggle" aria-label="Abrir menu">Menu</button>
    <nav class="nav-links">
      <a href="/">Início</a><a href="/features">Recursos</a><a href="/download">Download</a><a href="/pricing">Preços</a>
    </nav>
    <div class="nav-actions"><a class="btn ghost" href="/login">Entrar</a></div>
  </div>
</header>

<main class="auth-wrap">
  <div class="wrap">
    <form class="form-card" id="reset-form" novalidate>
      <h1>Redefinir senha</h1>
      <p class="sub" id="sub">Escolha uma nova senha para a sua conta.</p>
      <div class="form-notice" id="notice" hidden></div>
      <div class="field">
        <label for="password">Nova senha</label>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="new-password" required placeholder="Pelo menos 8 caracteres" />
          <button type="button" class="pw-toggle" data-pw-toggle aria-label="Mostrar senha" aria-pressed="false"></button>
        </div>
        <div class="err" data-error="password"></div>
      </div>
      <div class="field">
        <label for="confirm">Confirme a nova senha</label>
        <div class="pw">
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
          <button type="button" class="pw-toggle" data-pw-toggle aria-label="Mostrar senha" aria-pressed="false"></button>
        </div>
        <div class="err" data-error="confirm"></div>
      </div>
      <button class="btn lg block" type="submit" id="submit">Redefinir senha</button>
      <p class="form-foot"><a href="/login">Voltar para o login</a></p>
    </form>
  </div>
</main>

<footer class="site"><div class="wrap"><p class="fine">OpenHUD AI · Este site não coleta dados sem a sua ação.</p></div></footer>
<script src="/static/site/site.js?v=5.1.0"></script>
<script src="/static/account/account.js?v=5.1.0"></script>
<script>
  const { api, notice, fieldError, clearErrors, setBusy } = window.OpenHUD;
  const form = document.getElementById("reset-form");
  const nEl = document.getElementById("notice");
  const btn = document.getElementById("submit");
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token") || "";
  const verify = params.get("verify") || "";

  if (verify) {
    // This page doubles as the e-mail verification landing.
    document.getElementById("sub").textContent = "Confirmando o seu e-mail…";
    form.querySelectorAll(".field, button").forEach((el) => el.classList.add("hidden"));
    api("/api/account/verify-email", { token: verify, password: "" })
      .then(() => notice(nEl, "E-mail confirmado! Você já pode usar todos os recursos.", "ok"))
      .catch((err) => notice(nEl, err.message, "err"));
  } else if (!token) {
    notice(nEl, "Link inválido. Peça um novo em Recuperar senha.", "err");
    btn.disabled = true;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors(form); notice(nEl, "");
    const password = form.password.value;
    if (password.length < 8) { fieldError(form, "password", "A senha precisa ter pelo menos 8 caracteres."); return; }
    if (password !== form.confirm.value) { fieldError(form, "confirm", "As senhas não coincidem."); return; }
    setBusy(btn, true, "Salvando…");
    try {
      const d = await api("/api/account/reset-password", { token, password });
      notice(nEl, d.message || "Senha redefinida. Redirecionando…", "ok");
      setTimeout(() => (window.location.href = "/login"), 900);
    } catch (err) {
      notice(nEl, err.message, "err");
    } finally {
      setBusy(btn, false);
    }
  });
</script>
</body>
</html>
