<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recuperar senha — OpenHUD AI</title>
<meta name="description" content="Redefina a senha da sua conta OpenHUD AI." />
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/static/site/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/static/site/site.css?v=5.1.0" />
</head>
<body>
<header class="site">
  <div class="wrap nav" id="nav">
    <a class="brand" href="/"><img src="/static/site/logo.svg" alt="" width="26" height="26" /> OpenHUD AI</a>
    <button class="btn ghost nav-toggle" id="nav-toggle" aria-label="Abrir menu">Menu</button>
    <nav class="nav-links">
      <a href="/">Início</a><a href="/features">Recursos</a><a href="/download">Download</a><a href="/pricing">Preços</a>
    </nav>
    <div class="nav-actions"><a class="btn ghost" href="/login">Entrar</a></div>
  </div>
</header>

<main class="auth-wrap">
  <div class="wrap">
    <form class="form-card" id="forgot-form" novalidate>
      <h1>Recuperar senha</h1>
      <p class="sub">Informe o e-mail da sua conta. Se ele existir, enviaremos um link de redefinição válido por 1 hora.</p>
      <div class="form-notice" id="notice" hidden></div>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@exemplo.com" />
        <div class="err" data-error="email"></div>
      </div>
      <button class="btn lg block" type="submit" id="submit">Enviar link</button>
      <p class="form-foot"><a href="/login">Voltar para o login</a></p>
    </form>
  </div>
</main>

<footer class="site"><div class="wrap"><p class="fine">OpenHUD AI · Este site não coleta dados sem a sua ação.</p></div></footer>
<script src="/static/site/site.js?v=5.1.0"></script>
<script src="/static/account/account.js?v=5.1.0"></script>
<script>
  const { api, notice, fieldError, clearErrors, setBusy } = window.OpenHUD;
  const form = document.getElementById("forgot-form");
  const nEl = document.getElementById("notice");
  const btn = document.getElementById("submit");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors(form); notice(nEl, "");
    const email = form.email.value.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { fieldError(form, "email", "Informe um e-mail válido."); return; }
    setBusy(btn, true, "Enviando…");
    try {
      const d = await api("/api/account/forgot-password", { email });
      let msg = d.message || "Se o e-mail existir, enviamos um link de redefinição.";
      if (d.email_sent === false && !d.reset_link) {
        msg += " (Observação: o envio de e-mail ainda não está configurado neste servidor.)";
      }
      notice(nEl, msg, "ok");
      if (d.reset_link) {
        const a = document.createElement("a");
        a.href = d.reset_link; a.textContent = "Abrir link de redefinição (modo local)";
        a.style.display = "block"; a.style.marginTop = "10px";
        nEl.appendChild(document.createElement("br")); nEl.appendChild(a);
      }
    } catch (err) {
      notice(nEl, err.message, "err");
    } finally {
      setBusy(btn, false);
    }
  });
</script>
</body>
</html>
