[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhud"
version = "5.0.0"
description = "OpenHUD AI — assistente pessoal multifuncional, extensível e autônomo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenHUD" }]
keywords = ["ai", "agent", "assistant", "automation", "llm", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "websockets>=12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
voice = ["edge-tts>=6.1"]
desktop = ["pyinstaller>=6.6", "psutil>=5.9"]
agent = ["psutil>=5.9", "pynvml>=11"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
openhud = "openhud.__main__:main"
openhud-agent = "openhud.agent.agent_client:main"

[project.urls]
Homepage = "https://github.com/"
Changelog = "https://github.com/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["openhud*"]

[tool.setuptools.package-data]
"openhud.web" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
