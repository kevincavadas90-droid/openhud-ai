name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run test suite
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t openhud:ci .

      - name: Smoke test
        run: |
          docker run -d --name openhud -e OPENHUD_PASSWORD=test-password -e OPENHUD_AUTH=on -p 8000:8000 openhud:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            sleep 2
          done
          for path in /health /ready /version / /download /login; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000$path)
            echo "$path -> $code"
            test "$code" = "200"
          done
          docker logs openhud | tail -20
          docker rm -f openhud
